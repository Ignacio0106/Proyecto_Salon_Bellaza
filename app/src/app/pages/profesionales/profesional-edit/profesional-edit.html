<section class="page-container">
    <header class="page-header">
        <h1>Actualizar Profesional</h1>
        <p>Modifique los datos registrados del profesional.</p>
    </header>

    @if (loading()) {
        <p>Cargando información del profesional...</p>
    } @else {
        @if (error()) {
            <p class="error-message">
                {{ error() }}
            </p>
        }

        @if (profesional()) {
            <app-profesional-form
                [profesional]="profesional()"
                [saving]="saving()"
                (guardar)="guardar($event)"
                (cancelar)="cancelar()"
            />
        }
    }
</section>
