<div class="page-container">

  <div class="page-header">

    <div>
      <h1 class="page-title">Crear Servicio</h1>
      <p class="page-subtitle">Registra un nuevo servicio en el sistema.</p>
    </div>

    <button mat-stroked-button color="warn" type="button" (click)="cancelar()">
      <mat-icon>arrow_back</mat-icon>
      Volver
    </button>

  </div>

  @if (error()) {
    <div class="alert-error">
      {{ error() }}
    </div>
  }

  <app-servicio-form
    [saving]="saving()"
    (guardar)="guardar($event)"
    (cancelar)="cancelar()"
  />

</div>
