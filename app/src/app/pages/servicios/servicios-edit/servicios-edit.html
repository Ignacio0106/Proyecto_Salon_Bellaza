<div class="page-container">

  <div class="page-header">

    <div>
      <h1 class="page-title">Editar Servicio</h1>
      <p class="page-subtitle">Modifica la información del servicio.</p>
    </div>

    <button mat-stroked-button color="warn" type="button" (click)="cancelar()">
      <mat-icon>arrow_back</mat-icon>
      Volver
    </button>

  </div>

  @if (loading()) {
    <div class="state-box">
      <mat-spinner diameter="45"></mat-spinner>
      <p>Cargando información...</p>
    </div>
  }

  @if (error()) {
    <div class="alert-error">
      {{ error() }}
    </div>
  }

  @if (!loading() && servicio(); as servicio) {
    <app-servicio-form
      [servicio]="servicio"
      [saving]="saving()"
      (guardar)="guardar($event)"
      (cancelar)="cancelar()"
    />
  }

</div>
