<div class="auth-page">
  <mat-card class="auth-card" appearance="outlined">
    <mat-card-header>
      <div mat-card-avatar class="auth-avatar">
        <mat-icon>person_add</mat-icon>
      </div>
      <mat-card-title>Crear cuenta</mat-card-title>
      <mat-card-subtitle>Regístrese como cliente y reserve su primera cita</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (exito()) {
        <div class="server-success" role="status" aria-live="polite">
          <mat-icon>check_circle</mat-icon>
          <div>
            <strong>¡Cuenta creada correctamente!</strong>
            <span>Redirigiendo a iniciar sesión...</span>
          </div>
        </div>
      } @else {
        @if (errorServidor()) {
          <div class="server-error" role="alert">
            <mat-icon>error</mat-icon><span>{{ errorServidor() }}</span>
          </div>
        }

        <app-usuario-form
          [saving]="enviando()"
          (guardar)="registrar($event)"
          (cancelar)="cancelar()"
        />

        <p class="auth-switch">
          ¿Ya tiene cuenta?
          <a routerLink="/login">Inicie sesión</a>
        </p>
      }
    </mat-card-content>
  </mat-card>
</div>
